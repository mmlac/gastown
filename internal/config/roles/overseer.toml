# Overseer role definition
# Dynamic formula scheduler for Gas Town. One per town.

role = "overseer"
scope = "town"
nudge = "Run 'gt prime' to check schedule and begin dispatch cycle."
prompt_template = "overseer.md.tmpl"

[session]
pattern = "hq-overseer"
work_dir = "{town}/overseer"
needs_pre_sync = false
start_command = "exec claude --dangerously-skip-permissions"

[env]
GT_ROLE = "overseer"
GT_SCOPE = "town"

[health]
ping_timeout = "30s"
consecutive_failures = 3
kill_cooldown = "5m"
stuck_threshold = "1h"
